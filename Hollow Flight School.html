<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hollow Flight School</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a cave with a sticky tunnel-nav on top, one working chamber below, and a floating beat pill. Committed dark, lantern-lit look. */
:root{
  --cave:#1b1226; --cave2:#291b39; --rock:#38274b; --rock2:#4a3562;
  --ink:#fbf1de; --mute:#bba9cf; --line:#5a4478;
  --moss:#9be24f; --amber:#ffb93b; --rose:#ff6f91; --cyan:#4fdcec; --violet:#b293ff;
  --good:#7be08a; --bad:#ff7f6e;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  --lump:26px 18px 28px 20px / 20px 28px 18px 26px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cave);color:var(--ink);font:16px/1.55 var(--f-body);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;
  background-image:radial-gradient(900px 500px at 85% -10%,#4a2a6a55,transparent 70%),radial-gradient(700px 420px at -5% 30%,#1d4a4a44,transparent 70%),radial-gradient(600px 400px at 60% 110%,#6a3a1f33,transparent 70%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cave);z-index:30}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.4rem)} h2{font-size:1.7rem} h3{font-size:1.25rem}
p{margin:0}
a{color:var(--cyan)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--cave) 70%,#1b122600);padding:10px 0 14px}
.nav .wrap{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap;color:var(--amber)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--rock);padding:8px 16px;border-radius:999px 999px 14px 14px;font-family:var(--f-display);font-weight:500;color:var(--mute);box-shadow:0 3px 0 #120a1b}
.tab[aria-current="page"]{background:var(--amber);color:#2a1a05;box-shadow:0 3px 0 #a56d0a}
.tab:hover{color:var(--ink)} .tab[aria-current="page"]:hover{color:#2a1a05}
/* generic */
main{padding-block:14px 40px;display:flex;flex-direction:column;gap:22px}
.rock{background:linear-gradient(160deg,var(--rock),var(--cave2));border-radius:var(--lump);padding:20px 22px;box-shadow:0 4px 0 #120a1b,inset 0 0 0 2px #ffffff10;min-width:0}
.rock.glow-moss{box-shadow:0 4px 0 #120a1b,inset 0 0 0 2px var(--moss),0 0 26px #9be24f33}
.rock.glow-cyan{box-shadow:0 4px 0 #120a1b,inset 0 0 0 2px var(--cyan),0 0 26px #4fdcec33}
.rock.glow-rose{box-shadow:0 4px 0 #120a1b,inset 0 0 0 2px var(--rose),0 0 26px #ff6f9133}
.rock.glow-amber{box-shadow:0 4px 0 #120a1b,inset 0 0 0 2px var(--amber),0 0 26px #ffb93b33}
.rock.glow-violet{box-shadow:0 4px 0 #120a1b,inset 0 0 0 2px var(--violet),0 0 26px #b293ff33}
.eyebrow{font:700 .72rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
.btn{border:0;border-radius:16px 12px 18px 12px;padding:11px 20px;font-family:var(--f-display);font-weight:600;font-size:1rem;background:var(--moss);color:#17260a;box-shadow:0 4px 0 #4f7a1c;transition:transform .08s}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4f7a1c}
.btn.alt{background:var(--rock2);color:var(--ink);box-shadow:0 4px 0 #120a1b}
.btn.hot{background:var(--rose);color:#32060f;box-shadow:0 4px 0 #a02c49}
.btn.sun{background:var(--amber);color:#2a1a05;box-shadow:0 4px 0 #a56d0a}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-weight:700;font-size:.9rem;color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#052a30}
.bar{height:12px;background:#120a1b;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--moss);transition:width .5s}
.pill{display:inline-block;font:700 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 10px;background:#120a1b;color:var(--mute)}
.pill.new{background:var(--rose);color:#32060f}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font:700 .72rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.scroll-x{overflow-x:auto}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
.hero h1 span{color:var(--amber)}
.hero p.lead{font-size:1.1rem;color:var(--mute);max-width:46ch;margin-top:12px}
.hero svg{width:100%;height:auto;max-height:300px}
.drone{animation:bob 4s ease-in-out infinite;transform-origin:300px 150px}
.rotor{animation:flick .18s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-10px) rotate(1.5deg)}}
@keyframes flick{50%{transform:scaleX(.82)}}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.drone,.rotor{animation:none}html{scroll-behavior:auto}}
/* notice */
.alert{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.alert .when{font:700 1.6rem/1 var(--f-display);color:var(--rose)}
/* lessons */
.lcard{display:flex;flex-direction:column;gap:10px;text-align:left;border:0;width:100%}
.lcard h3{font-size:1.2rem}
.lesson-block h4{font-size:1.05rem;color:var(--amber);margin-bottom:6px}
.lesson-block ul{margin:0;padding-left:1.15rem;display:flex;flex-direction:column;gap:6px}
.lesson-block code{font-family:var(--f-mono);background:#120a1b;padding:2px 6px;border-radius:6px;font-size:.88em;overflow-wrap:anywhere}
.lesson-block.trap h4{color:var(--rose)} .lesson-block.tip h4{color:var(--cyan)}
.lesson-block.know h4{color:var(--moss)}
/* flash cards */
.card3d{perspective:1000px;max-width:560px;margin-inline:auto;width:100%}
.flash{min-height:230px;width:100%;border:0;border-radius:var(--lump);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:linear-gradient(160deg,var(--rock2),var(--rock));box-shadow:0 6px 0 #120a1b,inset 0 0 0 3px var(--violet),0 0 30px #b293ff33}
.flash.back{background:linear-gradient(160deg,#2d4a1c,#1d3412);box-shadow:0 6px 0 #0b1606,inset 0 0 0 3px var(--moss),0 0 30px #9be24f33}
.flash .big{font:600 1.8rem/1.2 var(--f-display)}
/* quiz */
.quiz-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--cave2);border:2px solid var(--line);border-radius:16px 12px 18px 12px;padding:12px 14px;font-weight:600;line-height:1.4}
.opt:hover{border-color:var(--cyan)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--rock2);display:grid;place-items:center;font:700 .85rem var(--f-mono)}
.opt.sel{border-color:var(--amber);background:#3b2a12} .opt.sel .k{background:var(--amber);color:#2a1a05}
.opt.right{border-color:var(--good);background:#1c3a21} .opt.right .k{background:var(--good);color:#0b2a10}
.opt.wrong{border-color:var(--bad);background:#43201c} .opt.wrong .k{background:var(--bad);color:#3a0f09}
.why{margin-top:14px;padding:14px 16px;border-radius:14px;background:#120a1b;border-left:5px solid var(--cyan)}
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.nav-grid button{border:2px solid var(--line);background:var(--cave2);border-radius:10px;padding:5px 0;font:700 .8rem var(--f-mono);color:var(--mute)}
.nav-grid button.ans{background:var(--rock2);color:var(--ink)}
.nav-grid button.flag{border-color:var(--rose)}
.nav-grid button.cur{outline:3px solid var(--amber);outline-offset:1px}
.timer{font:700 1.3rem var(--f-mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--rose)}
.scene-wrap{margin-top:14px;border-radius:14px;overflow:hidden;background:#eef0dc;border:3px solid var(--line)}
.scene-wrap svg{display:block;width:100%;height:auto}
.scene-cap{background:#120a1b;color:var(--mute);padding:8px 12px;font-size:.88rem}
.result-score{font:700 4rem/1 var(--f-display)}
.result-score.pass{color:var(--good)} .result-score.fail{color:var(--rose)}
/* chart lab */
.lab{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.lab{grid-template-columns:1fr}}
.lab svg{cursor:crosshair;touch-action:manipulation}
.readout{font:700 1.4rem var(--f-mono)}
/* beat */
.beat{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:var(--rock);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:0 4px 0 #120a1b,inset 0 0 0 2px var(--violet),0 0 24px #b293ff44}
.beat label{font:700 .72rem var(--f-mono);letter-spacing:.08em;color:var(--mute);display:flex;align-items:center;gap:8px}
.beat input[type=range]{width:96px;accent-color:var(--violet)}
.beat .btn{padding:8px 16px}
.eq{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.eq i{width:4px;height:6px;background:var(--violet);border-radius:2px}
.beat.on .eq i{animation:eq .5s ease-in-out infinite alternate}
.beat.on .eq i:nth-child(2){animation-delay:.12s}.beat.on .eq i:nth-child(3){animation-delay:.25s}
@keyframes eq{to{height:16px}}
@media(max-width:520px){.beat label{display:none}.beat{padding-left:12px}}
input[type=date],select{background:var(--cave2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit}
.plan{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.plan li{display:flex;gap:12px;align-items:flex-start}
.plan input{margin-top:6px;width:18px;height:18px;accent-color:var(--moss)}
.plan .d{flex:none;width:64px;font:700 .8rem var(--f-mono);color:var(--amber);padding-top:3px}
.crumb{background:none;border:0;color:var(--cyan);font-weight:700;padding:0;text-align:left}
</style>

  <div class="brand">Hollow Flight School</div>

</div></div>

<script>
/* Lessons. topic keys match the question bank: reg, air, chart, wx, perf, ops. Others are extra modules. */
const LESSONS = [
{id:'reg', topic:'reg', title:'Rules of the Hollow', sub:'Part 107 operating rules and privileges', glow:'moss',
 intro:'Every cavern has house rules. Part 107 is yours. Expect this area to carry the most questions on the test, and the numbers below come up again and again.',
 blocks:[
 ['Know cold', ['Max altitude: <b>400 ft AGL</b>, or within 400 ft of a structure and no higher than 400 ft above its top.','Max groundspeed: <b>87 knots</b> (100 mph).','Weight: <b>under 55 lb</b> at takeoff, payload included.','Visibility: <b>3 SM</b> from the control station. Clouds: <b>500 ft below, 2,000 ft horizontal</b>.','VLOS must be <b>unaided</b>, other than corrective lenses. FPV goggles, screens and NVGs do not satisfy it.','Yield right of way to <b>all</b> other aircraft.','<b>One</b> aircraft per remote pilot, unless waived.','No alcohol within <b>8 hours</b>, BAC under <b>0.04</b>.']],
 ['Certificates and records', ['Pilot: 16 or older, English proficient, fit to fly, passed the knowledge test.','Recurrent training every <b>24 calendar months</b>, online and free at FAASafety.gov.','Registration: aircraft over <b>0.55 lb</b>, valid <b>3 years</b>, number on an exterior surface or a compartment opened without tools. Part 107 aircraft are always registered.','Carry the certificate and present it with the aircraft on request (FAA, NTSB, law enforcement).']],
 ['Reporting', ['Report within <b>10 days</b> if there is serious injury, loss of consciousness, or property damage (not the UAS itself) over <b>$500</b>.','In an emergency you may deviate from the rules as needed, and you may be asked for a written report.']],
 ['Flying over people (Subpart D)', ['<b>Category 1</b>: 0.55 lb or less, no exposed rotating parts that could cut skin.','<b>Category 2 and 3</b>: injury threshold of <b>11 ft-lb</b> of kinetic energy, plus a declaration of compliance. Category 3 limits flight over open-air assemblies.','<b>Category 4</b>: airworthiness certificate.']],
 ['Remote ID', ['Standard Remote ID aircraft, or a broadcast module, or flying within an FAA-recognized identification area (FRIA).','Compliance is the operator\'s job.']],
 ['Trap', ['Units. Questions mix <i>knots</i> and <i>mph</i>, <i>AGL</i> and <i>MSL</i>, <i>statute</i> and <i>nautical</i> miles. Read the unit before the number.','Recreational flyers follow TRUST and community rules. Anything for business or compensation is Part 107.']],
 ['Test-day tip', ['If two answers differ by one word like "always" or "never", the extreme word is usually the wrong one.']]
 ]},
{id:'air', topic:'air', title:'Tunnels & Ceilings', sub:'Airspace classes, authorizations and special use', glow:'cyan',
 intro:'Airspace is a set of tunnels stacked on top of each other. Knowing which tunnel you are in tells you whether you need a ticket.',
 blocks:[
 ['The classes', ['<b>Class B</b>: surface to 10,000 MSL, solid blue, upside-down wedding cake.','<b>Class C</b>: 5 NM core, surface to 4,000 AGL. 10 NM shelf, 1,200 to 4,000 AGL. Solid magenta.','<b>Class D</b>: surface to 2,500 AGL around a tower. Dashed blue.','<b>Class E surface</b>: dashed magenta. Needs authorization.','<b>Class E</b> otherwise starts at 700 AGL (magenta vignette) or 1,200 AGL.','<b>Class G</b>: uncontrolled. No authorization, but all other rules still apply.']],
 ['Getting permission', ['<b>LAANC</b> gives near real-time authorization where the UAS Facility Map shows a ceiling.','Grids marked <b>0</b> need a manual request through <b>FAA DroneZone</b>.','Authorization is needed in B, C, D and E-surface, at <b>any</b> altitude.']],
 ['Special use airspace', ['<b>Prohibited (P)</b>: no entry. <b>Restricted (R)</b>: permission from controlling agency.','<b>MOA</b>, <b>Warning</b>, <b>Alert</b>: hazardous activity, not prohibited. Check status and stay alert.','<b>TFRs</b>: never on the chart. Check NOTAMs and the FAA TFR list before every flight.','Sports stadium TFR: 3 NM and up to 3,000 AGL during events.']],
 ['Airport signs', ['Blue airport symbol = control tower. Magenta = no tower.','Rotating beacon: white-green = civil land, white-yellow = water, two whites and a green = military, white-green-yellow = heliport.']],
 ['Trap', ['A low altitude does not exempt you. 100 ft AGL inside Class D still needs authorization.','Controlled airspace on the chart is only part of the picture. Always add NOTAMs, TFRs and local rules (parks, prisons, critical infrastructure).']]
 ]},
{id:'chart', topic:'chart', title:'Reading the Cave Walls', sub:'Sectional charts, the big October 26, 2026 change', glow:'rose',
 intro:'Starting <b>October 26, 2026</b> the FAA adds chart-image questions that use real sectional excerpts <b>not shown in the printed testing supplement</b>. The rules do not change. The picture does. Practice reading symbols, not memorizing figures.',
 blocks:[
 ['What the FAA announced', ['The Unmanned Aircraft General (UAG) test adds image-based questions built on current sectional chart excerpts.','Part 107 regulations, the 60-question format and the 70 percent pass mark are unchanged, as reported by industry sources and the FAA testing advisory.','FAA sample questions ask what airspace surrounds an airport and whether ATC authorization is needed, and which radio frequency to use when a tower is closed.','Some questions may give an on-screen measuring tool. Practice with the <b>ruler</b> in the Chart Lab and the chart scale bar (1 NM on the scale, not on your screen).','The printed supplement stays at test centers for now, but the new chart images are not in it. The images stay confidential, so you cannot preview them. The cure is fluency in the legend.']],
 ['Symbols to read at a glance', ['<b>Boxed numbers</b>: Class D ceiling in hundreds of feet MSL (31 = 3,100 ft MSL).','<b>Fractions in magenta or blue rings</b>: top over bottom in hundreds of feet MSL (45 over SFC; 45 over 17).','<b>Obstructions</b>: top MSL, then (height AGL). MSL minus AGL gives local ground elevation.','<b>MEF</b>: large number thousands, small number hundreds. 12 and 7 = 12,700 ft MSL.','Blue airport = tower. Magenta airport = no tower.','Hatched blue with R- = restricted. Dashed magenta = Class E surface. Faded magenta band = Class E from 700 AGL.']],
 ['Radio frequency boxes', ['Airport data block: name, elevation, <b>L</b> = lighted, longest runway in hundreds of feet, then frequencies.','<b>CT</b> = control tower. A <b>star</b> by it = part-time tower, so check hours.','<b>ATIS</b>, <b>ASOS/AWOS</b> and <b>CTAF</b> or <b>UNICOM</b> are listed separately. When the tower is closed, use the listed CTAF.']],
 ['Chart facts', ['Sectional scale: <b>1:500,000</b>. Terminal Area Chart: <b>1:250,000</b>.','Revised every <b>56 days</b>.','Check the FAA Aeronautical Chart User\'s Guide for the current legend.']],
 ['Practice method', ['Open the <b>Chart Lab</b> tab. Each excerpt is original artwork that mimics chart conventions.','For every symbol, say aloud what it means and what you must do before launching.','After the Lab, download a real current sectional or use the FAA VFR Raster Charts viewer and find one of each symbol near your own flying sites.']],
 ['Trap', ['MSL versus AGL. A ring ceiling is MSL. A flight limit of 400 feet is AGL. You will need to convert.']]
 ]},
{id:'wx', topic:'wx', title:'Weather in the Deep', sub:'Reports, forecasts and what weather does to your aircraft', glow:'amber',
 intro:'Reading the sky is half of flight planning. Decode quickly and calmly, then ask: can I keep 3 SM visibility and 500/2,000 cloud clearance?',
 blocks:[
 ['Decode a METAR', ['<code>KDAL 211753Z 18012G22KT 10SM FEW040 BKN070 28/19 A2992</code>','Station, day and UTC time, wind (from, true), visibility, clouds (AGL, hundreds of feet), temp/dew point °C, altimeter inHg.','Cloud cover: FEW 1-2, SCT 3-4, BKN 5-7, OVC 8 (eighths of sky). <b>Ceiling = lowest BKN or OVC</b>.','UTC to Central: subtract 5 hours in daylight time, 6 in standard time.']],
 ['Flight categories', ['VFR: ceiling above 3,000 and visibility above 5 SM.','MVFR: 1,000 to 3,000 and/or 3 to 5 SM.','IFR: 500 to under 1,000 and/or 1 to under 3 SM.','LIFR: below 500 and/or below 1 SM.']],
 ['Forecasts and warnings', ['TAF: forecast for within 5 SM of an airport.','AIRMET Sierra: IFR, mountain obscuration. Tango: turbulence, 30 kt winds, LLWS. Zulu: icing, freezing levels.','SIGMET: severe hazards for everyone. PIREP: pilot report.']],
 ['Physics you can use', ['<b>Fog</b>: temperature and dew point within 2-3 °C.','<b>Cloud base</b>: spread in °C divided by 2.5, times 1,000 ft. (°F: divide by 4.4.)','<b>Density altitude</b> rises with high, hot, humid conditions. Thrust and endurance drop.','<b>Inversions</b> trap haze. <b>Cold fronts</b> bring squalls. <b>Lenticular clouds</b> warn of mountain wave.','Thunderstorms: stay clear. Microbursts and gust fronts reach far.','Wind around buildings creates turbulent eddies, and sea breezes blow from water to land by day.']],
 ['Trap', ['METAR and TAF winds are true. A tower announcement uses magnetic.','The ceiling is not the same as the lowest cloud layer. FEW and SCT are not ceilings.']]
 ]},
{id:'perf', topic:'perf', title:'Weight, Balance & Lift', sub:'Loading, CG and performance math', glow:'violet',
 intro:'Every gram on board changes how your aircraft behaves. These problems are easy once you set them up in a table.',
 blocks:[
 ['Weight and balance', ['<b>Moment = weight x arm</b>. <b>CG = total moment / total weight</b>.','Make a table. Add weights, add moments, divide.','Adding payload moves the CG toward it. Stay inside the manufacturer\'s CG range.','Aft CG = less stable. Forward CG = more stable but needs more control input.']],
 ['Performance', ['Heavier aircraft: shorter endurance, lower ceiling, slower climb.','High density altitude: less thrust, less lift, less endurance.','Cold batteries lose usable capacity. Warm them and land early.','Load factor in a level turn: <b>1 / cos(bank)</b>. 60° = 2 G.','Stall speed rises with the square root of load factor.']],
 ['Quick math', ['Pressure altitude = field elevation + (29.92 - altimeter) x 1,000.','Groundspeed = airspeed -/+ wind component. Distance = groundspeed x time.','Example: 25 kt airspeed, 10 kt headwind, 12 minutes = 15 x 0.2 = 3 NM.']],
 ['Trap', ['Set up units first. A moment table in pounds and inches stays in pounds and inches.','Batteries swelling, hot or damaged are out of service, not "watch and see."']]
 ]},
{id:'ops', topic:'ops', title:'Wits Underground', sub:'Decision-making, crew, human factors, radio, emergencies, maintenance', glow:'moss',
 intro:'This is the biggest knowledge area by topic count: judgment, health, communication and what to do when things go wrong.',
 blocks:[

 ['Hazardous attitudes (and antidotes)', ['<b>Anti-authority</b>: "Follow the rules."','<b>Impulsivity</b>: "Not so fast. Think first."','<b>Invulnerability</b>: "It could happen to me."','<b>Macho</b>: "Taking chances is foolish."','<b>Resignation</b>: "I\'m not helpless."']],
 ['CRM', ['Communication, task management, situational awareness, leadership.','The remote PIC briefs roles, hazards, communication and emergency actions.']],
 ['Human factors', ['Night: ~30 minutes to dark adapt. Use <b>dim red light</b> and <b>off-center viewing</b>.','<b>Autokinesis</b>: a fixed light seems to move. Shift your gaze.','Fatigue, stress, dehydration, drugs and alcohol degrade judgment.']],
 ['Radio, emergencies and maintenance', ['CTAF: self-announce at non-towered airports. Left traffic is standard.','Set and test failsafe and return-to-home altitude before each flight.','Flyaway into controlled airspace: notify ATC.','After a hard landing, inspect everything.','Follow manufacturer maintenance and firmware guidance. Keep records.','Lithium batteries: protect terminals, store at low charge, retire swollen packs.']]

{id:'night', topic:null, title:'Night Glow Operations', sub:'Night flying, thermal imaging and what the exam says', glow:'cyan', extra:true,
 intro:'You plan to work with night operations and thermal imaging. This module covers the rules the exam asks about and some practical points the exam does not.',
 blocks:[
 ['Night rules (exam content)', ['Operations in civil twilight or at night are allowed with <b>anti-collision lighting visible for 3 SM</b> and a flash rate that avoids collisions.','Remote pilots must have completed current training that includes night operations, such as the free online recurrent course.','The 3 SM visibility and cloud clearance rules still apply. You still need VLOS to the aircraft.','Plan the area by daylight. Obstacles, wires and trees vanish at night.']],
 ['Vision (exam content)', ['Dark adaptation takes about 30 minutes. A phone at full brightness undoes it.','Use dim red lighting, off-center viewing, and slow scanning.','Watch for autokinesis and loss of depth perception.']],
 ['Thermal imaging (practical, beyond the exam)', ['A thermal feed on your screen is a camera view. It does <b>not</b> replace VLOS. Part 107 requires unaided sight of the aircraft, so you or a visual observer must keep it in view.','Thermal cameras read surface temperature, adjusted for <b>emissivity</b>. Shiny metal and glass reflect surroundings and can mislead.','Rooftop moisture and insulation checks often work best around sunset or before dawn, when materials are shedding heat at different rates. Solar array inspections need strong sunlight.','Check the camera\'s radiometric and resolution specs against the job.']],
 ['Night vision goggles', ['Goggles or any device that aids vision cannot be used to satisfy VLOS. Use unaided sight or a visual observer, or hold an FAA waiver.']],
 ['Trap', ['"Night" does not mean exempt from lighting or training. And a thermal screen does not count as line of sight.']]
 ]},

 ['Crop health imaging (practical)', ['Multispectral cameras use bands like red and near-infrared to compute indexes such as <b>NDVI</b>.','Fly near solar noon for consistent light and use calibration panels.','Scout in the same growth stage each season to compare maps.']],
 ['Spraying and payloads (check the rules)', ['Part 107 covers sUAS under 55 lb, but dispensing agricultural materials involves additional FAA authority (Part 137) and EPA label rules. Heavier spray drones need exemptions. Confirm current requirements with the FAA before any spraying.','Hazardous material carriage is prohibited by 107.36. Ask the FAA how it applies to crop chemicals.']],

  let days='';
  if(S.testDate){const d=Math.ceil((new Date(S.testDate+'T00:00:00')-new Date(new Date().toDateString()))/864e5);days=d>0?`<b>${d}</b> day${d===1?'':'s'} until test day`:d===0?'<b>Test day.</b> You are ready.':'Test date has passed. Update it below.'}
  const weak=EXAMT.filter(t=>S.stats[t]&&S.stats[t].a>=5).sort((a,b)=>pct(S.stats[a].c,S.stats[a].a)-pct(S.stats[b].c,S.stats[b].a))[0];
  const nextL=LESSONS.find(l=>!S.done[l.id]);
  const next=weak&&pct(S.stats[weak].c,S.stats[weak].a)<80?`Your weakest area is <b>${TOPICS[weak][0]}</b>. Run a practice set on it.`:nextL?`Next lesson: <b>${nextL.title}</b>.`:'All lessons done. Take a full mock exam.';

   <div class="row" style="margin-top:12px"><button class="btn hot" data-go="chart">Open Chart Lab</button><button class="btn alt" data-go="learn" data-sub="chart">Chart lesson</button></div></div></section>

     <p class="mute">${o.a?`${o.c} of ${o.a} exam-topic answers correct. Aim for 80% or better.`:'Answer a few questions and your score lands here.'}</p>

     <p style="margin:10px 0">${days||'Set your test date to start a countdown.'}</p>

     <p class="mute" style="margin-top:14px">${doneN} of ${LESSONS.length} lessons done · ${S.mocks.length} mock exam${S.mocks.length===1?'':'s'} taken</p></div>
  </section>

  <section class="rock"><h2>What the test covers</h2><p class="mute" style="margin:6px 0 12px">60 questions across five ACS knowledge areas. The mock exam uses this same mix.</p>
   <div class="scroll-x"><table><thead><tr><th>Area</th><th>Share</th><th>About</th><th>Mock mix</th></tr></thead><tbody>
   ${BLUEPRINT.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]} q</td><td>${r[2]} q</td></tr>`).join('')}</tbody></table></div>
   <p class="mute" style="margin-top:10px;font-size:.9rem">Percentages follow the ACS knowledge areas as published. Confirm the current format, fee and any new advisory at faa.gov before you book.</p></section>

  <section class="rock"><h2>Seven-day crunch plan</h2><p class="mute" style="margin:6px 0 12px">Tick each step as you finish it.</p>
   <ul class="plan">${PLAN.map((p,i)=>`<li><input type="checkbox" id="pl${i}" data-plan="${i}" ${S.plan[i]?'checked':''}><span class="d">${p[0]}</span><label for="pl${i}">${p[1]}</label></li>`).join('')}</ul></section>

function listHTML(arr){return '<ul>'+arr.map(x=>`<li>${x}</li>`).join('')+'</ul>'}
function learn(v){
  if(sub){const l=LESSONS.find(x=>x.id===sub);if(l)return lesson(v,l)}
  v.innerHTML=`<div><div class="eyebrow">Nine modules</div><h2>Lessons</h2><p class="mute" style="margin-top:6px">Six exam areas, then three extras for your night, thermal, farm and mapping work.</p></div>
  <div class="grid">${LESSONS.map(l=>{const n=ALLQ.filter(q=>q.t===l.id).length;return `<button class="rock glow-${l.glow} lcard" data-go="learn" data-sub="${l.id}">
    <div class="row" style="justify-content:space-between"><span class="pill">${l.extra?'Extra':'Exam area'}</span>${S.done[l.id]?'<span class="pill" style="background:var(--moss);color:#17260a">Done</span>':''}</div>
    <h3>${l.title}</h3><p class="mute">${l.sub}</p><p class="mute" style="font-size:.88rem">${l.blocks.length} sections${n?` · ${n} questions`:''}</p></button>`}).join('')}</div>`;
}
function lesson(v,l){
  const key=b=>/^trap/i.test(b[0])?'trap':/^test-day tip/i.test(b[0])?'tip':/know cold/i.test(b[0])?'know':'';
  v.innerHTML=`<div><button class="crumb" data-go="learn">&larr; All lessons</button></div>
  <section class="rock glow-${l.glow}"><div class="eyebrow">${l.extra?'Extra module':'Exam area'}</div><h2 style="margin:6px 0 8px">${l.title}</h2><p class="mute">${l.sub}</p><p style="margin-top:12px">${l.intro}</p></section>
  ${l.blocks.map(b=>`<section class="rock lesson-block ${key(b)}"><h4>${b[0]}</h4>${listHTML(b[1])}</section>`).join('')}
  <div class="row"><button class="btn" id="done">${S.done[l.id]?'Marked done':'Mark lesson done'}</button>
  ${ALLQ.some(q=>q.t===l.id)?`<button class="btn sun" id="drill">Practice this topic</button>`:''}
  <button class="btn alt" data-go="cards">Flash cards</button></div>`;
  $('#done').onclick=()=>{S.done[l.id]=true;save();$('#done').textContent='Marked done'};
  const d=$('#drill');if(d)d.onclick=()=>{go('practice');startPractice(ALLQ.filter(q=>q.t===l.id),l.title)};
}

/* flash cards */
let deck=null;
function cards(v){
  if(!deck){deck={topic:'all',q:[],i:0,flip:false,known:0};buildDeck()}
  const chips=['all',...EXAMT,'night'].map(t=>`<button class="chip" data-t="${t}" aria-pressed="${deck.topic===t}">${t==='all'?'All':TOPICS[t][0]}</button>`).join('');
  const c=deck.q[deck.i];
  v.innerHTML=`<div><div class="eyebrow">${CARDS.length} cards</div><h2>Flash cards</h2></div><div class="row">${chips}</div>
  ${c?`<div class="card3d"><button class="flash ${deck.flip?'back':''}" id="flash" aria-label="Flip card"><span class="eyebrow">${TOPICS[c[0]]?TOPICS[c[0]][0]:c[0]} · ${deck.i+1} of ${deck.q.length}</span><span class="big">${deck.flip?c[2]:c[1]}</span><span class="mute">${deck.flip?'':'Tap to flip'}</span></button></div>
  <div class="row" style="justify-content:center"><button class="btn hot" id="again">Again</button><button class="btn" id="got">Got it</button></div>
  <p class="mute" style="text-align:center">${deck.known} marked as known this round. Press space to flip.</p>`:`<div class="rock" style="text-align:center"><h3>Round complete</h3><p class="mute" style="margin:8px 0 14px">${deck.known} cards known.</p><button class="btn" id="again2">Shuffle a new round</button></div>`}`;
  v.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{deck.topic=b.dataset.t;buildDeck();cards(v)});
  const f=$('#flash');if(f)f.onclick=()=>{deck.flip=!deck.flip;cards(v)};
  const nx=known=>{if(known)deck.known++;else deck.q.push(deck.q[deck.i]);deck.i++;deck.flip=false;cards(v)};
  if($('#got'))$('#got').onclick=()=>nx(true);if($('#again'))$('#again').onclick=()=>nx(false);
  if($('#again2'))$('#again2').onclick=()=>{buildDeck();cards(v)};
}
function buildDeck(){deck.q=shuffle(CARDS.filter(c=>deck.topic==='all'||c[0]===deck.topic));deck.i=0;deck.flip=false;deck.known=0}
document.addEventListener('keydown',e=>{if(tab==='cards'&&e.code==='Space'&&deck&&deck.q[deck.i]&&e.target===document.body){e.preventDefault();deck.flip=!deck.flip;cards($('#view'))}});

/* ---------- quiz engine ---------- */
let Z=null; // active quiz
function startPractice(qs,label){
  Z={mode:'practice',label,items:shuffle(qs).map(mkItem),i:0,done:false};renderQuiz()}
function mkItem(q){const order=shuffle([0,1,2,3]);return{q,order,pick:null,flag:false,locked:false}}
function sceneHTML(id){const s=window.SCENES&&window.SCENES[id];if(!s)return'';return `<div class="scene-wrap"><svg viewBox="0 0 600 400" role="img" aria-label="${s.name} chart excerpt">${s.svg}</svg><div class="scene-cap"><b>${s.name}</b> · ${s.note} Scale: 1 NM = ${s.px} px on this excerpt, see the bar at lower left.</div></div>`}
function optsHTML(it,reveal){return it.order.map((oi,k)=>{let cls='';if(reveal){if(oi===0)cls='right';else if(it.pick===oi)cls='wrong'}else if(it.pick===oi)cls='sel';
  return `<button class="opt ${cls}" data-pick="${oi}" ${reveal?'disabled':''}><span class="k">${'ABCD'[k]}</span><span>${esc(it.q.o[oi])}</span></button>`}).join('')}

function renderQuiz(){
  const v=$('#view');if(!Z)return;
  if(Z.done)return results(v);
  const it=Z.items[Z.i],mock=Z.mode==='mock',reveal=!mock&&it.locked;
  const answered=Z.items.filter(x=>x.pick!==null).length;
  const top=mock?`<div class="quiz-top"><div><div class="eyebrow">Mock exam</div><div class="timer" id="timer"></div></div><div class="mute">${answered} of ${Z.items.length} answered</div></div>`
   :`<div class="quiz-top"><div><div class="eyebrow">${esc(Z.label)}</div><b>Question ${Z.i+1} of ${Z.items.length}</b></div><button class="btn alt" id="quit">End set</button></div>`;
  v.innerHTML=`${top}
  <section class="rock glow-${TOPICS[it.q.t][1]}"><div class="row" style="justify-content:space-between"><span class="pill">${TOPICS[it.q.t][0]}</span>${mock?`<button class="chip" id="flag" aria-pressed="${it.flag}">${it.flag?'Flagged':'Flag for review'}</button>`:''}</div>
   <h3 style="margin-top:12px;line-height:1.35;font-family:var(--f-body);font-weight:800">${esc(it.q.q)}</h3>${it.q.s?sceneHTML(it.q.s):''}
   <div class="opts">${optsHTML(it,reveal)}</div>
   ${reveal?`<div class="why"><b>${it.pick===0?'Right.':'Not quite.'}</b> ${esc(it.q.e)}</div>`:''}
  </section>
  <div class="row" style="justify-content:space-between">
   <button class="btn alt" id="prev" ${Z.i===0?'disabled':''}>Back</button>
   ${mock?(Z.i===Z.items.length-1?`<button class="btn hot" id="submit">Review and submit</button>`:`<button class="btn" id="next">Next</button>`)
     :(it.locked?`<button class="btn" id="next">${Z.i===Z.items.length-1?'See results':'Next'}</button>`:'<span class="mute">Pick an answer</span>')}</div>
  ${mock?`<section class="rock"><div class="eyebrow" style="margin-bottom:10px">Question map</div><div class="nav-grid">${Z.items.map((x,k)=>`<button data-jump="${k}" class="${x.pick!==null?'ans':''} ${x.flag?'flag':''} ${k===Z.i?'cur':''}" aria-label="Question ${k+1}">${k+1}</button>`).join('')}</div></section>`:''}`;
  v.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const oi=+b.dataset.pick;
    if(mock){it.pick=oi;renderQuiz()}else if(!it.locked){it.pick=oi;it.locked=true;rec(it.q.t,oi===0,it.q.id);save();renderQuiz()}});
  const nx=()=>{if(Z.i<Z.items.length-1){Z.i++;renderQuiz();window.scrollTo({top:0})}else{Z.done=true;finish();renderQuiz()}};
  if($('#next'))$('#next').onclick=nx;
  if($('#prev'))$('#prev').onclick=()=>{Z.i--;renderQuiz();window.scrollTo({top:0})};
  if($('#quit'))$('#quit').onclick=()=>{Z.done=true;finish();renderQuiz()};
  if($('#flag'))$('#flag').onclick=()=>{it.flag=!it.flag;renderQuiz()};
  v.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{Z.i=+b.dataset.jump;renderQuiz();window.scrollTo({top:0})});
  if($('#submit'))$('#submit').onclick=()=>confirmSubmit(v);
  if(mock)tick();
}
function confirmSubmit(v){
  const un=Z.items.filter(x=>x.pick===null).length,fl=Z.items.filter(x=>x.flag).length;
  const box=document.createElement('section');box.className='rock glow-amber';
  box.innerHTML=`<h3>Ready to submit?</h3><p class="mute" style="margin:8px 0 14px">${un?`<b>${un}</b> unanswered (these count as wrong). `:'Every question is answered. '}${fl?`<b>${fl}</b> flagged for review.`:''}</p><div class="row"><button class="btn hot" id="yes">Submit exam</button><button class="btn alt" id="no">Keep working</button></div>`;
  v.appendChild(box);box.scrollIntoView({behavior:'smooth',block:'center'});
  $('#yes').onclick=()=>{Z.done=true;finish();renderQuiz()};$('#no').onclick=()=>box.remove();
}
function tick(){
  stopTimer();const el=()=>$('#timer');
  const paint=()=>{const left=Math.max(0,Math.round((Z.end-Date.now())/1000));const t=el();if(!t)return;
    t.textContent=`${Math.floor(left/3600)}:${String(Math.floor(left%3600/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;t.classList.toggle('low',left<600);
    if(left<=0&&!Z.done){Z.done=true;finish();renderQuiz()}};
  paint();timerId=setInterval(paint,1000);
}
function finish(){
  stopTimer();const it=Z.items;
  Z.score=it.filter(x=>x.pick===0).length;Z.total=it.length;
  if(Z.mode==='mock'){
    const by={};it.forEach(x=>{const b=by[x.q.t]||(by[x.q.t]={c:0,a:0});b.a++;if(x.pick===0)b.c++;rec(x.q.t,x.pick===0,x.q.id)});
    Z.secs=Math.round((Date.now()-Z.start)/1000);
    S.mocks.push({d:new Date().toISOString().slice(0,10),c:Z.score,n:Z.total,by,secs:Z.secs});save();
  }
}
function results(v){
  const p=pct(Z.score,Z.total),mock=Z.mode==='mock',pass=p>=70;
  const wrong=Z.items.filter(x=>x.pick!==0&&(mock||x.pick!==null));
  const by={};Z.items.forEach(x=>{if(mock||x.pick!==null){const b=by[x.q.t]||(by[x.q.t]={c:0,a:0});b.a++;if(x.pick===0)b.c++}});
  v.innerHTML=`<section class="rock glow-${pass?'moss':'rose'}" style="text-align:center"><div class="eyebrow">${mock?'Mock exam result':esc(Z.label)}</div>
   <div class="result-score ${pass?'pass':'fail'}" style="margin:10px 0">${p}%</div>
   <h3>${Z.score} of ${Z.total} correct${mock?(pass?' · passing score':' · below the 70% line (42 of 60)'):''}</h3>
   ${mock?`<p class="mute" style="margin-top:6px">Time used: ${Math.floor(Z.secs/60)} min of 120</p>`:''}</section>
  <section class="rock"><h3 style="margin-bottom:12px">By topic</h3>${Object.keys(by).map(t=>`<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span>${TOPICS[t][0]}</span><span class="mute">${by[t].c}/${by[t].a}</span></div><div class="bar"><i style="width:${pct(by[t].c,by[t].a)}%;background:var(--${TOPICS[t][1]})"></i></div></div>`).join('')}</section>
  <div class="row"><button class="btn" data-go="${mock?'mock':'practice'}">${mock?'Another mock':'New set'}</button>${wrong.length?'<button class="btn sun" id="rm">Drill the misses</button>':''}<button class="btn alt" data-go="progress">Progress</button></div>
  ${wrong.length?`<section class="rock"><h3 style="margin-bottom:10px">Review your misses</h3><div style="display:flex;flex-direction:column;gap:16px">${wrong.map(x=>`<div><b>${esc(x.q.q)}</b>${x.q.s?`<div class="mute" style="font-size:.9rem">Chart question: ${window.SCENES[x.q.s].name}</div>`:''}<p style="margin-top:6px"><span style="color:var(--bad)">${x.pick===null?'Not answered':'You: '+esc(x.q.o[x.pick])}</span><br><span style="color:var(--good)">Correct: ${esc(x.q.o[0])}</span></p><p class="mute" style="margin-top:4px">${esc(x.q.e)}</p></div>`).join('')}</div></section>`:''}`;
  const rm=$('#rm');if(rm)rm.onclick=()=>startPractice(wrong.map(x=>x.q),'Drill: your misses');
}

function practice(v){
  if(Z&&Z.mode==='practice'&&!Z.done)return renderQuiz();
  const missed=Object.keys(S.missed).length;
  v.innerHTML=`<div><div class="eyebrow">Instant feedback</div><h2>Practice</h2><p class="mute" style="margin-top:6px">Pick a topic and see the explanation after every answer.</p></div>
  <section class="rock"><div class="grid">${[...EXAMT,'night','field','exam'].map(t=>{const n=ALLQ.filter(q=>q.t===t).length,s=S.stats[t];return `<button class="rock glow-${TOPICS[t][1]} lcard" data-pt="${t}" style="padding:16px"><h3 style="font-size:1.1rem">${TOPICS[t][0]}</h3><p class="mute" style="font-size:.9rem">${n} questions${s?` · ${pct(s.c,s.a)}% so far`:''}</p></button>`}).join('')}</div></section>
  <div class="row"><label class="mute" for="cnt">Questions per set</label><select id="cnt"><option>10</option><option selected>20</option><option>40</option><option value="999">All</option></select>
   <button class="btn sun" id="pmiss" ${missed?'':'disabled'}>Drill missed (${missed})</button><button class="btn alt" id="pall">Mixed exam topics</button></div>`;
  const n=()=>+$('#cnt').value;
  v.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>startPractice(shuffle(ALLQ.filter(q=>q.t===b.dataset.pt)).slice(0,n()),TOPICS[b.dataset.pt][0]));
  $('#pall').onclick=()=>startPractice(shuffle(ALLQ.filter(q=>EXAMT.includes(q.t))).slice(0,n()),'Mixed exam topics');
  $('#pmiss').onclick=()=>startPractice(ALLQ.filter(q=>S.missed[q.id]).slice(0,n()),'Drill: missed questions');
}

function pickMock(){
  let out=[];
  for(const t of Object.keys(MOCK_MIX)){
    const pool=shuffle(ALLQ.filter(q=>q.t===t)).sort((a,b)=>(S.seen[a.id]||0)-(S.seen[b.id]||0));
    out=out.concat(pool.slice(0,MOCK_MIX[t]));
  }
  return shuffle(out);
}
function mock(v){
  if(Z&&Z.mode==='mock'&&!Z.done)return renderQuiz();
  const last=S.mocks[S.mocks.length-1];
  v.innerHTML=`<div><div class="eyebrow">Test conditions</div><h2>Mock exam</h2></div>
  <section class="rock glow-amber"><h3>60 questions · 2 hours · 70% to pass</h3>
   <ul style="margin:12px 0 0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px"><li>Same topic mix as the real test. Chart questions come with excerpts you measure against the printed scale bar.</li><li>No answers shown until you submit. You can flag, skip and change answers.</li><li>The timer runs out at two hours and the exam submits itself.</li><li>Questions you have seen least are picked first, so repeat mocks stay fresh.</li><li>Aim for 80% or better on two mocks in a row before test day.</li></ul>
   <div class="row" style="margin-top:16px"><button class="btn hot" id="go60">Start the 60-question exam</button><button class="btn sun" id="blitz">Chart Blitz (15 chart questions)</button></div></section>
  ${last?`<section class="rock"><div class="eyebrow">Last attempt</div><p style="margin-top:6px"><b>${pct(last.c,last.n)}%</b> on ${last.d} (${last.c}/${last.n}).</p></section>`:''}`;
  $('#go60').onclick=()=>{Z={mode:'mock',items:pickMock().map(mkItem),i:0,done:false,start:Date.now(),end:Date.now()+7200000};renderQuiz()};
  $('#blitz').onclick=()=>startPractice(shuffle(ALLQ.filter(q=>q.s)).slice(0,15),'Chart Blitz');
}

/* ---------- chart lab ---------- */
let sceneId='s1',pts=[];
function chartlab(v){
  const ids=Object.keys(window.SCENES),s=window.SCENES[sceneId];
  const linked=ALLQ.filter(q=>q.s===sceneId);
  v.innerHTML=`<div><div class="eyebrow">New on the test: Oct 26, 2026</div><h2>Chart Lab</h2><p class="mute" style="margin-top:6px">Original chart excerpts drawn with real sectional conventions. Click two points to measure with the scale bar, just as you will on screen.</p></div>
  <div class="row">${ids.map(i=>`<button class="chip" data-sc="${i}" aria-pressed="${i===sceneId}">${window.SCENES[i].name}</button>`).join('')}</div>
  <div class="lab"><section class="rock" style="padding:12px"><div class="scene-wrap" style="margin:0"><svg id="sv" viewBox="0 0 600 400" role="img" aria-label="${s.name} chart excerpt">${s.svg}<g id="ov"></g></svg><div class="scene-cap">${s.note}</div></div></section>
   <section class="rock glow-cyan"><div class="eyebrow">Ruler</div><div class="readout" id="ro" style="margin:8px 0">-- NM</div><p class="mute" id="rh">Click a start point and an end point on the chart.</p>
     <div class="row" style="margin-top:12px"><button class="btn alt" id="rc">Clear</button></div>
     <div class="eyebrow" style="margin-top:18px">Symbol drills</div><ul class="mute" style="padding-left:1.1rem;margin:8px 0 0;display:flex;flex-direction:column;gap:4px;font-size:.92rem"><li>Say the class and what it needs before launch.</li><li>Convert MSL ceilings to AGL at the launch point.</li><li>Find the frequency you would call.</li></ul>
     <div class="row" style="margin-top:14px"><button class="btn" id="tq">Questions on this excerpt (${linked.length})</button></div></section></div>`;
  v.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{sceneId=b.dataset.sc;pts=[];chartlab(v)});
  const sv=$('#sv'),ov=$('#ov');
  function draw(){ov.innerHTML=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#ff6f91" stroke="#fff" stroke-width="2"/>`).join('');
    if(pts.length===2){const d=Math.hypot(pts[1][0]-pts[0][0],pts[1][1]-pts[0][1])/s.px;ov.innerHTML+=`<line x1="${pts[0][0]}" y1="${pts[0][1]}" x2="${pts[1][0]}" y2="${pts[1][1]}" stroke="#ff6f91" stroke-width="3" stroke-dasharray="6 4"/>`;
      $('#ro').textContent=d.toFixed(1)+' NM';$('#rh').textContent='1 NM = '+s.px+' px on this excerpt. Compare with the scale bar.'}
    else{$('#ro').textContent='-- NM';$('#rh').textContent=pts.length?'Now click the end point.':'Click a start point and an end point on the chart.'}}
  sv.addEventListener('click',e=>{const r=sv.getBoundingClientRect();const x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*400/r.height;
    if(pts.length>=2)pts=[];pts.push([Math.round(x),Math.round(y)]);draw()});
  $('#rc').onclick=()=>{pts=[];draw()};
  $('#tq').onclick=()=>{go('practice');startPractice(linked,s.name+' excerpt')};
}

/* ---------- progress ---------- */
function progress(v){
  const m=S.mocks.slice(-10),o=overall();
  const chart=m.length?`<svg viewBox="0 0 ${Math.max(300,m.length*52+40)} 190" style="width:100%;max-width:560px;height:auto" role="img" aria-label="Mock exam scores"><line x1="30" x2="${m.length*52+30}" y1="${160-0.7*130}" y2="${160-0.7*130}" stroke="#ffb93b" stroke-dasharray="5 4"/><text x="2" y="${164-0.7*130}" fill="#ffb93b" font-size="10" font-family="monospace">70</text>
   ${m.map((x,i)=>{const p=pct(x.c,x.n),h=1.3*p;return `<rect x="${40+i*52}" y="${160-h}" width="34" height="${h}" rx="6" fill="${p>=70?'#9be24f':'#ff6f91'}"/><text x="${57+i*52}" y="${154-h}" text-anchor="middle" fill="#fbf1de" font-size="11" font-family="monospace" font-weight="700">${p}</text><text x="${57+i*52}" y="178" text-anchor="middle" fill="#bba9cf" font-size="9" font-family="monospace">${x.d.slice(5)}</text>`}).join('')}</svg>`:'<p class="mute">No mock exams yet. Take one to see your trend.</p>';
  v.innerHTML=`<div><div class="eyebrow">Your trail</div><h2>Progress</h2></div>
  <section class="rock"><h3 style="margin-bottom:12px">Accuracy by topic</h3>${Object.keys(TOPICS).map(t=>{const s=S.stats[t],p=s?pct(s.c,s.a):0;return `<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><span>${TOPICS[t][0]}</span><span class="mute">${s?`${p}% (${s.c}/${s.a})`:'not started'}</span></div><div class="bar"><i style="width:${p}%;background:var(--${TOPICS[t][1]})"></i></div></div>`}).join('')}
   <p class="mute">Exam topics overall: ${o.a?pct(o.c,o.a)+'%':'--'}</p></section>
  <section class="rock"><h3 style="margin-bottom:12px">Mock exam scores</h3>${chart}</section>
  <section class="rock"><h3>Missed questions to revisit: ${Object.keys(S.missed).length}</h3><div class="row" style="margin-top:12px"><button class="btn sun" id="dm" ${Object.keys(S.missed).length?'':'disabled'}>Drill them</button><button class="btn alt" id="rs">Reset all progress</button></div><p class="mute" style="margin-top:10px;font-size:.9rem">Progress is saved in this browser only.</p></section>`;
  $('#dm').onclick=()=>{go('practice');startPractice(ALLQ.filter(q=>S.missed[q.id]),'Drill: missed questions')};
  $('#rs').onclick=()=>{const b=$('#rs');if(b.dataset.s){S={done:{},stats:{},missed:{},mocks:[],seen:{},cards:{},plan:{},testDate:''};save();progress(v)}else{b.dataset.s=1;b.textContent='Tap again to erase everything';b.className='btn hot'}};
}

/* ---------- study beat (original loop, generated in the browser) ---------- */
const Beat=(()=>{let ctx,master,on=false,bpm=92,step=0,next=0,tid=null;
  const N=[0,2,4,7,9,12,14,16];const hz=n=>261.63*Math.pow(2,n/12);
  const LEAD=[0,null,4,null,7,null,4,2,0,null,9,null,7,null,4,null];
  const BASS=[0,null,null,0,null,null,7,null,5,null,null,5,null,null,7,null];
  function noise(t,dur,type,f,g){const b=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource();s.buffer=b;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=f;const gn=ctx.createGain();gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl).connect(gn).connect(master);s.start(t)}
  function tone(t,f,dur,type,g){const o=ctx.createOscillator(),gn=ctx.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(g,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn).connect(master);o.start(t);o.stop(t+dur+.02)}
  function kick(t){const o=ctx.createOscillator(),gn=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);gn.gain.setValueAtTime(.9,t);gn.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(gn).connect(master);o.start(t);o.stop(t+.3)}
  function play(s,t){
    if([0,6,10].includes(s))kick(t);
    if(s===4||s===12){noise(t,.16,'bandpass',1800,.45);tone(t,190,.1,'triangle',.25)}
    if(s%2===0)noise(t,.04,'highpass',7000,s%4===0?.22:.12);
    if(s===15)noise(t,.05,'highpass',5000,.15);
    if(LEAD[s]!==null){tone(t,hz(LEAD[s]+12),.32,'triangle',.22);tone(t,hz(LEAD[s]+24),.18,'sine',.06)}
    if(BASS[s]!==null)tone(t,hz(BASS[s]-24),.28,'sine',.5);
  }
  function sched(){while(next<ctx.currentTime+.15){play(step,next);next+=60/bpm/4;step=(step+1)%16}}
  return{get on(){return on},set bpm(v){bpm=v},
   start(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(!master){master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination)}
     ctx.resume();on=true;step=0;next=ctx.currentTime+.05;tid=setInterval(sched,25)}catch(e){on=false}return on},
   stop(){on=false;clearInterval(tid)}}})();
const bb=$('#beatbtn');
bb.onclick=()=>{const on=Beat.on?(Beat.stop(),false):Beat.start();bb.setAttribute('aria-pressed',on);bb.textContent=on?'Stop beat':'Study beat';$('#beat').classList.toggle('on',on)};
$('#bpm').oninput=e=>{Beat.bpm=+e.target.value;$('#bpmv').textContent=e.target.value};

/* ---------- boot ---------- */
const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))tab=h;
renderTabs();render();
})();
</script>
